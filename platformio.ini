; Милестоун 0: проверка железа.
; Внимание: BOARD_HAS_PSRAM обязателен. Без него ядро arduino-esp32
; выкидывает CONFIG_SPIRAM и не вызывает psramInit() — PSRAM не появится.

[platformio]
; `pio run` без -e собирает только прошивку. Окружение native не собирается
; по умолчанию: для тестов оно не нужно (см. tools/run_tests.sh).
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
upload_port = /dev/cu.usbserial-5A6D0057111
; На плате 8 МБ флеша: отдаём 3 МБ прошивке и 4 МБ LittleFS под плагины.
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*> -<probe_main.cpp>
lib_deps =
    m5stack/M5Unified@^0.2.7

; Окружение для IDE: компилирует только чистые модули под Mac.
; Тесты запускаются через tools/run_tests.sh и PlatformIO не требуют.
[env:native]
platform = native
build_src_filter = +<pure/>
